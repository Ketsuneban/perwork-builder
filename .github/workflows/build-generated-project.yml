name: Build uploaded Minecraft project
run-name: PERWORK build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: PERWORK build request ID
        required: true
        type: string

concurrency:
  group: perwork-builder-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out builder tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch source using GitHub OIDC
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
        run: |
          set -euo pipefail
          mkdir -p perwork-context/builder
          printf 'Preparing PERWORK build %s\n' "$JOB_ID" > perwork-context/build.log

          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"

          # Workers KV is eventually consistent across regions. Retry cold reads
          # briefly so a just-created job/source is available to the GitHub runner.
          fetch_with_retry() {
            local url="$1"
            local destination="$2"
            local label="$3"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                "$url" -o "$destination"; then
                return 0
              fi
              rm -f "$destination"
              if [ "$attempt" -lt 12 ]; then
                echo "$label is not visible yet (attempt $attempt/12); retrying in 5 seconds."
                sleep 5
              fi
            done
            echo "Unable to fetch $label after 12 attempts." >&2
            return 1
          }

          fetch_with_retry \
            "$WORKER_URL/api/builder/internal/config?job_id=$JOB_ID" \
            "$RUNNER_TEMP/perwork-job.json" "build configuration"

          fetch_with_retry \
            "$WORKER_URL/api/builder/internal/source?job_id=$JOB_ID" \
            "$RUNNER_TEMP/perwork-source.zip" "source ZIP"
          unset OIDC_TOKEN

          python builder/safe_extract.py \
            --archive "$RUNNER_TEMP/perwork-source.zip" \
            --destination "$RUNNER_TEMP/perwork-source"

          python - <<'PY'
          import json, os
          config = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "perwork-job.json"), encoding="utf-8"))
          for key in ("minecraft", "loader", "kind", "mod_id", "mod_name", "mod_version"):
              value = str(config.get(key, ""))
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"Invalid build setting: {key}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"PERWORK_{key.upper()}={value}\n")
          PY

          python builder/generate.py \
            --source "$RUNNER_TEMP/perwork-source/main" \
            --output perwork-context/project \
            --minecraft "$PERWORK_MINECRAFT" \
            --loader "$PERWORK_LOADER" \
            --kind "$PERWORK_KIND" \
            --mod-id "$PERWORK_MOD_ID" \
            --mod-name "$PERWORK_MOD_NAME" \
            --mod-version "$PERWORK_MOD_VERSION"

          cp builder/generate.py builder/safe_extract.py builder/profiles.json perwork-context/builder/
          echo "Generated project prepared. Untrusted Gradle tasks run in a separate token-free job." >> perwork-context/build.log

      - name: Upload prepared project
        uses: actions/upload-artifact@v4
        with:
          name: perwork-input-${{ inputs.job_id }}
          path: perwork-context/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    outputs:
      compile_outcome: ${{ steps.compile.outcome }}
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
    steps:
      - name: Download prepared project
        uses: actions/download-artifact@v4
        with:
          name: perwork-input-${{ inputs.job_id }}
          path: perwork-context

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: Compile project
        id: compile
        continue-on-error: true
        shell: bash
        working-directory: perwork-context/project
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee -a "$GITHUB_WORKSPACE/perwork-context/build.log"

      - name: Upload JAR and build log
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perwork-build-${{ inputs.job_id }}
          path: |
            perwork-context/build.log
            perwork-context/project/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 1

  report:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Report result to PERWORK
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMPILE_OUTCOME: ${{ needs.build.outputs.compile_outcome }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          RESULT: ${{ (needs.prepare.result == 'success' && needs.build.result == 'success' && needs.build.outputs.compile_outcome == 'success' && needs.build.outputs.artifact_id != '') && 'success' || 'failure' }}
          MESSAGE: ${{ needs.prepare.result != 'success' && 'Project preparation failed. Check the preparation logs.' || (needs.build.outputs.compile_outcome == 'success' && 'Minecraft project compiled successfully.' || 'Build failed. Download the diagnostic artifact for build.log.') }}
        run: |
          set -euo pipefail
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"

          python - <<'PY' > "$RUNNER_TEMP/perwork-result.json"
          import json, os
          print(json.dumps({
              "status": os.environ["RESULT"],
              "message": os.environ["MESSAGE"],
              "artifact_id": int(os.environ["ARTIFACT_ID"]) if os.environ.get("ARTIFACT_ID", "").isdigit() else None,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          }))
          PY

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/perwork-result.json" \
            "$WORKER_URL/api/builder/internal/complete?job_id=$JOB_ID"
          unset OIDC_TOKEN
