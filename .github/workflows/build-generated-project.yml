name: Build generated Minecraft project

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify generator syntax
        run: python -m py_compile builder/generate.py

      - name: Generate example project
        run: |
          python builder/generate.py             --source examples/main             --output generated-project             --minecraft 1.20.1             --loader forge             --kind mod             --mod-id examplemod             --mod-name "PERWORK Example Mod"             --mod-version 1.0.0

      - name: Build generated project
        working-directory: generated-project
        run: |
          gradle --no-daemon build

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-minecraft-jars
          path: generated-project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
