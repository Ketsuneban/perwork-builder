name: Build uploaded Minecraft project
run-name: PERWORK build ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: PERWORK build request ID
        required: true
        type: string

concurrency:
  group: perwork-builder-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      compile_outcome: ${{ steps.compile.outcome }}
      artifact_id: ${{ steps.upload.outputs['artifact-id'] }}
    steps:
      - name: Check out builder tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize build log
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          mkdir -p perwork-context/project
          printf 'Preparing PERWORK build %s\n' "$JOB_ID" > perwork-context/build.log

      - name: Fetch source and configuration using GitHub OIDC
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
        run: |
          set -euo pipefail
          if [[ ! "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Invalid PERWORK job ID." >&2
            exit 1
          fi

          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"

          report_phase() {
            local phase="$1"
            curl --fail --silent --show-error --max-time 10 -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"phase\":\"$phase\"}" \
              "$WORKER_URL/api/builder/internal/progress?job_id=$JOB_ID" \
              || echo "Could not report PERWORK build stage '$phase'; continuing."
          }
          report_phase "preparing"

          # Workers KV is eventually consistent across regions. Retry cold reads
          # briefly so a just-created job/source is available to the GitHub runner.
          fetch_with_retry() {
            local url="$1"
            local destination="$2"
            local label="$3"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H "Authorization: Bearer $OIDC_TOKEN" \
                "$url" -o "$destination"; then
                return 0
              fi
              rm -f "$destination"
              if [ "$attempt" -lt 12 ]; then
                echo "$label is not visible yet (attempt $attempt/12); retrying in 5 seconds."
                sleep 5
              fi
            done
            echo "Unable to fetch $label after 12 attempts." >&2
            return 1
          }

          fetch_with_retry \
            "$WORKER_URL/api/builder/internal/config?job_id=$JOB_ID" \
            "$RUNNER_TEMP/perwork-job.json" "build configuration"

          fetch_with_retry \
            "$WORKER_URL/api/builder/internal/source?job_id=$JOB_ID" \
            "$RUNNER_TEMP/perwork-source.zip" "source ZIP"
          unset OIDC_TOKEN

          python builder/safe_extract.py \
            --archive "$RUNNER_TEMP/perwork-source.zip" \
            --destination "$RUNNER_TEMP/perwork-source"

          python - <<'PY'
          import json, os
          config = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "perwork-job.json"), encoding="utf-8"))
          for key in ("minecraft", "loader", "kind", "mod_id", "mod_name", "mod_version"):
              value = str(config.get(key, ""))
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"Invalid build setting: {key}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"PERWORK_{key.upper()}={value}\n")
          PY

      - name: Generate Minecraft project from uploaded sources
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
        run: |
          set -euo pipefail
          : "${PERWORK_MINECRAFT:?Build configuration did not propagate from the previous step.}"
          : "${PERWORK_LOADER:?Build loader did not propagate from the previous step.}"
          : "${PERWORK_KIND:?Build kind did not propagate from the previous step.}"
          : "${PERWORK_MOD_ID:?Mod ID did not propagate from the previous step.}"
          : "${PERWORK_MOD_NAME:?Mod name did not propagate from the previous step.}"
          : "${PERWORK_MOD_VERSION:?Mod version did not propagate from the previous step.}"

          python builder/generate.py \
            --source "$RUNNER_TEMP/perwork-source/main" \
            --output perwork-context/project \
            --minecraft "$PERWORK_MINECRAFT" \
            --loader "$PERWORK_LOADER" \
            --kind "$PERWORK_KIND" \
            --mod-id "$PERWORK_MOD_ID" \
            --mod-name "$PERWORK_MOD_NAME" \
            --mod-version "$PERWORK_MOD_VERSION" 2>&1 | tee -a "$GITHUB_WORKSPACE/perwork-context/build.log"

          # Keep only the generated project in the build workspace. No source
          # archive or intermediate source artifact is uploaded to GitHub.
          rm -f "$RUNNER_TEMP/perwork-source.zip" "$RUNNER_TEMP/perwork-job.json"
          rm -rf "$RUNNER_TEMP/perwork-source"

          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"
          curl --fail --silent --show-error --max-time 10 -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"phase":"compiling"}' \
            "$WORKER_URL/api/builder/internal/progress?job_id=$JOB_ID" \
            || echo "Could not report PERWORK compile stage; continuing."
          unset OIDC_TOKEN
          echo "Project prepared. Compilation will run in a credential-free container." >> perwork-context/build.log

      - name: Compile in an isolated Gradle/JDK 17 container
        id: compile
        continue-on-error: true
        shell: bash
        working-directory: perwork-context/project
        env:
          GRADLE_IMAGE: gradle:8.1.1-jdk17-focal
        run: |
          set -euo pipefail
          docker pull "$GRADLE_IMAGE"
          CLEAN_GRADLE_HOME="$RUNNER_TEMP/perwork-gradle-home"
          mkdir -p "$CLEAN_GRADLE_HOME"
          chmod 700 "$CLEAN_GRADLE_HOME"

          # The container sees only the generated project and an empty Gradle
          # cache. No Git checkout, OIDC request token, GITHUB_TOKEN, Actions
          # runtime token, Worker secret or runner filesystem is mounted.
          docker run --rm \
            --network bridge \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            --memory 6g \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            --mount "type=bind,src=$CLEAN_GRADLE_HOME,dst=/gradle-home" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env GRADLE_USER_HOME=/gradle-home \
            --env GRADLE_OPTS=-Duser.home=/tmp \
            --entrypoint gradle \
            "$GRADLE_IMAGE" \
            --no-daemon --stacktrace build 2>&1 | tee -a "$GITHUB_WORKSPACE/perwork-context/build.log"

      - name: Require a non-empty compiled JAR
        if: steps.compile.outcome == 'success'
        shell: bash
        working-directory: perwork-context/project
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          for jar in "${jars[@]}"; do
            if [[ -s "$jar" ]]; then
              echo "Verified compiled JAR: $jar"
              exit 0
            fi
          done
          echo "Gradle completed without producing a non-empty JAR." >&2
          exit 1

      - name: Report packaging phase
        if: steps.compile.outcome == 'success'
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
        run: |
          set -euo pipefail
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"
          curl --fail --silent --show-error --max-time 10 -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"phase":"packaging"}' \
            "$WORKER_URL/api/builder/internal/progress?job_id=$JOB_ID" \
            || echo "Could not report PERWORK packaging phase; continuing."
          unset OIDC_TOKEN

      - name: Upload JAR and build log
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perwork-build-${{ inputs.job_id }}
          path: |
            perwork-context/build.log
            perwork-context/project/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 1

  report:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Report result to PERWORK
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          WORKER_URL: https://perwork.okey-g00gle3000.workers.dev
          BUILD_RESULT: ${{ needs.build.result }}
          COMPILE_OUTCOME: ${{ needs.build.outputs.compile_outcome }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          RESULT: ${{ (needs.build.result == 'success' && needs.build.outputs.compile_outcome == 'success' && needs.build.outputs.artifact_id != '') && 'success' || 'failure' }}
          MESSAGE: ${{ (needs.build.result == 'success' && needs.build.outputs.compile_outcome == 'success' && needs.build.outputs.artifact_id != '') && 'Minecraft project compiled in an isolated container and a non-empty JAR was verified.' || 'Build failed or produced no JAR. Download the diagnostic artifact for build.log.' }}
        run: |
          set -euo pipefail
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=perwork-builder"
          OIDC_TOKEN="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$TOKEN_URL" | python -c "import json,sys; print(json.load(sys.stdin)['value'])")"

          python - <<'PY' > "$RUNNER_TEMP/perwork-result.json"
          import json, os
          print(json.dumps({
              "status": os.environ["RESULT"],
              "message": os.environ["MESSAGE"],
              "artifact_id": int(os.environ["ARTIFACT_ID"]) if os.environ.get("ARTIFACT_ID", "").isdigit() else None,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          }))
          PY

          curl --fail --silent --show-error --max-time 20 -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/perwork-result.json" \
            "$WORKER_URL/api/builder/internal/complete?job_id=$JOB_ID"
          unset OIDC_TOKEN
