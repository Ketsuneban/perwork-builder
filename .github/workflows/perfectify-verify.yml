name: Perfectify Verification
on:
  push:
    branches: [feature/perfectify]
    paths:
      - 'perfectify/**'
      - '.github/workflows/perfectify-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Perfectify
        run: gradle --no-daemon --project-dir perfectify clean build --stacktrace
      - name: Verify Jar
        run: jar tf perfectify/build/libs/perfectify-*.jar | grep 'dev/ketsuneban/perfectify/Perfectify.class'
      - name: Test dedicated Minecraft server startup
        shell: bash
        run: |
          mkdir -p perfectify/run
          printf 'eula=true\n' > perfectify/run/eula.txt
          set +e
          timeout 150s gradle --no-daemon --project-dir perfectify runServer --console=plain --stacktrace 2>&1 | tee perfectify-server-smoke.log
          outcome=${PIPESTATUS[0]}
          set -e
          if ! grep -Fq 'Done (' perfectify-server-smoke.log; then
            echo 'Minecraft dedicated server never reported startup completion'
            exit 1
          fi
          if [ "$outcome" -ne 0 ] && [ "$outcome" -ne 124 ]; then
            echo "Server exited with code $outcome"
            exit 1
          fi
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfectify-server-smoke-log
          path: perfectify-server-smoke.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfectify-alpha-test
          path: perfectify/build/libs/*.jar
          retention-days: 3
