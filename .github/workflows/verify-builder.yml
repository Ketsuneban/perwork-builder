name: Verify PERWORK Builder profiles

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - "examples/**"
      - ".github/workflows/verify-builder.yml"
      - ".github/workflows/build-generated-project.yml"
      - "SUPPORTED_PROFILES.md"
  pull_request:
    branches: [main]
    paths:
      - "builder/**"
      - "examples/**"
      - ".github/workflows/verify-builder.yml"
      - ".github/workflows/build-generated-project.yml"
      - "SUPPORTED_PROFILES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-1-20-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate workflow YAML and expressions
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          marker = "$" + "{{"
          escaped = chr(92) + "$" + "{"
          for name in ("build-generated-project.yml", "verify-builder.yml"):
              path = Path(".github/workflows") / name
              source = path.read_text(encoding="utf-8")
              assert escaped not in source, f"Escaped expression found in {name}"
              parsed = yaml.safe_load(source)
              assert isinstance(parsed, dict), f"Invalid workflow YAML: {name}"
          build = Path(".github/workflows/build-generated-project.yml").read_text(encoding="utf-8")
          assert marker + " inputs.job_id }}" in build, "workflow_dispatch job_id expression is missing"
          assert "perwork-input-" not in build, "User source must not be uploaded as an intermediate public artifact"
          assert "docker run" in build and "--entrypoint gradle" in build, "Gradle must run inside the isolated container"
          assert "perwork-context/project/build/libs/*.jar" in build, "Final JAR artifact path is missing"
          steps = yaml.safe_load(build)["jobs"]["build"]["steps"]
          fetch_step = next(step for step in steps if step.get("name") == "Fetch source and configuration using GitHub OIDC")
          generate_step = next(step for step in steps if step.get("name") == "Generate Minecraft project from uploaded sources")
          assert "GITHUB_ENV" in fetch_step.get("run", ""), "Build configuration must be exported for subsequent steps"
          assert "PERWORK_MINECRAFT" not in fetch_step.get("run", ""), "Do not consume GITHUB_ENV variables in the same step that writes them"
          assert "PERWORK_MINECRAFT" in generate_step.get("run", ""), "Separate generation step must consume exported build configuration"
          assert "tee -a" in generate_step.get("run", ""), "Project generation diagnostics must be persisted to build.log"
          print("Workflow YAML, dispatch input, source privacy, environment propagation and container isolation validated.")
          PY

      - name: Validate generator
        run: |
          python -m py_compile builder/generate.py builder/safe_extract.py
          python builder/generate.py --source examples/main --output generated-project --minecraft 1.20.1 --loader forge --kind mod --mod-id examplemod --mod-name "PERWORK Example Mod" --mod-version 1.0.0
      - name: Synchronize Forge entrypoint ID with generated metadata
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          cases = {
              "literal": '''package test;
          import net.minecraftforge.fml.common.Mod;
          @Mod("hellomod")
          public final class HelloMod {}
          ''',
              "constant": '''package test;
          import net.minecraftforge.fml.common.Mod;
          @Mod(HelloMod.MOD_ID)
          public final class HelloMod {
              public static final String MOD_ID = "hellomod";
          }
          ''',
          }
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              for name, source_text in cases.items():
                  main = root / name / "main"
                  source_file = main / "java" / "test" / "HelloMod.java"
                  source_file.parent.mkdir(parents=True)
                  source_file.write_text(source_text, encoding="utf-8")
                  output = root / name / "out"
                  subprocess.run([
                      sys.executable, "builder/generate.py",
                      "--source", str(main),
                      "--output", str(output),
                      "--minecraft", "1.20.1", "--loader", "forge", "--kind", "mod",
                      "--mod-id", "perwork_test", "--mod-name", "PERWORK Test"
                  ], check=True)
                  generated_java = next((output / "src/main/java").rglob("HelloMod.java")).read_text(encoding="utf-8")
                  metadata = (output / "src/main/resources/META-INF/mods.toml").read_text(encoding="utf-8")
                  assert 'modId="perwork_test"' in metadata
                  if name == "literal":
                      assert '@Mod("perwork_test")' in generated_java
                  else:
                      assert '@Mod(HelloMod.MOD_ID)' in generated_java
                      assert 'MOD_ID = "perwork_test"' in generated_java
          print("Forge literal and constant @Mod IDs are synchronized with mods.toml.")
          PY

      - name: Reject control characters in mod names
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmp:
              result = subprocess.run(
                  [
                      sys.executable, "builder/generate.py",
                      "--source", "examples/main",
                      "--output", str(Path(tmp) / "generated"),
                      "--minecraft", "1.20.1",
                      "--loader", "forge",
                      "--kind", "mod",
                      "--mod-id", "examplemod",
                      "--mod-name", "Bad\tName",
                  ],
                  text=True,
                  capture_output=True,
              )
          assert result.returncode != 0, "Generator accepted a tab character in mod-name."
          assert "control characters" in result.stderr, result.stderr
          print("Generator correctly rejects control characters in mod-name.")
          PY
      - name: Build example mod in isolated Gradle/JDK 17 container
        working-directory: generated-project
        run: |
          set -euo pipefail
          image="gradle:8.1.1-jdk17-focal"
          docker pull "$image"
          cache="$RUNNER_TEMP/perwork-gradle-home"
          mkdir -p "$cache"
          docker run --rm \
            --network bridge \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 512 \
            --memory 6g \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=$PWD,dst=/workspace" \
            --mount "type=bind,src=$cache,dst=/gradle-home" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env GRADLE_USER_HOME=/gradle-home \
            --env GRADLE_OPTS=-Duser.home=/tmp \
            --entrypoint gradle \
            "$image" \
            --no-daemon --stacktrace build
      - name: Upload verification JAR
        uses: actions/upload-artifact@v4
        with:
          name: verified-minecraft-1.20.1-forge-mod
          path: generated-project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 3
